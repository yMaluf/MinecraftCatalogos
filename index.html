<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Farm Catalog ⛏</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #4ade80;
  --red: #f87171;
  --yellow: #facc15;
  --blue: #60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  background: #000;
  min-height:100vh; color:#e4f0e4;
  font-family:'VT323',monospace;
  overflow-x:hidden;
}

/* BG Canvas */
#bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

/* Vignette */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.85) 100%);
}

/* Scanlines */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
}

/* Layout */
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:32px 16px;}

/* Header */
.header{text-align:center;margin-bottom:36px;animation:fadeDown .6s ease both;}
.pick{font-size:52px;animation:float 3s ease-in-out infinite;display:inline-block;margin-bottom:8px;}
.title{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(13px,2.8vw,22px);
  color:var(--green);
  animation:pulseGlow 2.5s ease-in-out infinite;
  line-height:1.5; margin-bottom:10px;
}
.subtitle{
  color:#aaa;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(8px,1.4vw,12px);
  letter-spacing:.15em;
  text-transform:uppercase;
}

/* Stats — only total */
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:28px;flex-wrap:wrap;}
.stat-card{
  border-radius:10px;padding:16px 32px;text-align:center;
  animation:statPop .4s cubic-bezier(.34,1.56,.64,1) both;
}
.stat-val{font-family:'Press Start 2P',monospace;font-size:28px;}
.stat-lbl{font-size:15px;color:#555;letter-spacing:.15em;margin-top:4px;font-family:'Press Start 2P',monospace;font-size:9px;}

/* Controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search{
  background:#0a0a0a;border:1px solid #222;border-radius:6px;
  color:#ccc;padding:10px 14px;font-size:20px;
  flex:1;min-width:160px;font-family:'VT323',monospace;
  transition:border-color .2s,box-shadow .2s;
}
.search:focus{border-color:var(--green);box-shadow:0 0 14px rgba(74,222,128,.2);outline:none;}
.btn-add{
  background:#000;border:2px solid var(--green);color:var(--green);
  border-radius:6px;padding:10px 20px;cursor:pointer;
  font-family:'Press Start 2P',monospace;font-size:9px;
  text-shadow:0 0 8px rgba(74,222,128,.5);white-space:nowrap;
  transition:all .2s;
}
.btn-add:hover{background:#0d2a0d;box-shadow:0 0 24px rgba(74,222,128,.4);transform:scale(1.04);}

/* Categories — sem emoji, texto em negrito */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;}
.cat-btn{
  background:#000;
  border:1px solid #222;
  color:#555;
  border-radius:6px;
  padding:7px 16px;
  font-size:14px;
  cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-weight:700;
  letter-spacing:.04em;
  transition:all .15s;
  text-transform:uppercase;
}
.cat-btn:hover{color:#aaa;border-color:#444;transform:scale(1.05);}
.cat-btn.active{
  background:#0a1f0a;
  border-color:var(--green);
  color:var(--green);
  box-shadow:0 0 12px rgba(74,222,128,.25);
  text-shadow:0 0 8px rgba(74,222,128,.4);
}

/* Grid */
.farm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.empty{grid-column:1/-1;text-align:center;color:#333;padding:60px 0;}
.empty-icon{font-size:44px;margin-bottom:10px;}
.empty-txt{font-size:22px;}
.empty-sub{font-size:16px;color:#222;margin-top:4px;}

/* Farm card */
.farm-card{
  background:#080808;
  border:1px solid #1a1a1a;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
  animation:cardIn .4s ease both;
  transition:transform .2s,box-shadow .2s;
}
.farm-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 40px rgba(74,222,128,.1),0 0 0 1px rgba(74,222,128,.12);}
.card-img-wrap{height:150px;overflow:hidden;position:relative;cursor:zoom-in;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;}
.card-img-wrap .img-fade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,#080808);}
.card-img-wrap .zoom-hint{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border-radius:4px;padding:2px 6px;font-size:11px;color:#888;}
.card-no-img{height:64px;display:flex;align-items:center;justify-content:center;font-size:36px;border-bottom:1px solid #1a1a1a;}
.card-body{padding:14px 16px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-name{font-family:'Press Start 2P',monospace;font-size:8px;color:#e0e0e0;line-height:1.7;flex:1;}
.status-badge{font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;font-family:'Press Start 2P',monospace;font-size:7px;}
.type-pill{display:inline-block;background:#111;border:1px solid #222;color:#666;font-size:13px;padding:2px 10px;border-radius:12px;margin-bottom:8px;font-family:'Press Start 2P',monospace;font-size:7px;}
.card-coords{color:#444;font-size:16px;margin-bottom:6px;background:#050505;border-radius:4px;padding:4px 8px;border:1px solid #111;}
.card-notes{color:#555;font-size:16px;line-height:1.4;margin-bottom:10px;}
.card-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-edit,.btn-del{border-radius:6px;padding:6px 12px;cursor:pointer;font-size:16px;font-family:'VT323',monospace;transition:all .15s;}
.btn-edit:hover,.btn-del:hover{transform:scale(1.15);filter:brightness(1.6);}
.btn-edit{background:#0a0a0a;border:1px solid #1e3a1e;color:#4a9a6a;}
.btn-del{background:#0f0606;border:1px solid #3a1a1a;color:#9a5a5a;}

/* Modal overlay */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:16px;
}
.modal{
  background:#080808;border:1px solid #222;border-radius:12px;
  padding:24px;width:100%;max-width:480px;
  box-shadow:0 0 80px rgba(74,222,128,.08);
  animation:fadeSlideIn .25s ease;
  max-height:90vh;overflow-y:auto;
}
.modal-title{color:var(--green);font-family:'Press Start 2P',monospace;font-size:11px;text-shadow:0 0 12px rgba(74,222,128,.4);margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;color:#444;font-size:9px;letter-spacing:.1em;margin-bottom:5px;font-family:'Press Start 2P',monospace;}
.field input,.field textarea,.field select{
  width:100%;background:#050505;border:1px solid #1e1e1e;border-radius:6px;
  color:#ccc;padding:10px 12px;font-size:19px;font-family:'VT323',monospace;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 12px rgba(74,222,128,.2);outline:none;}
.field textarea{resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}

/* Image upload */
.upload-zone{
  width:100%;border-radius:8px;
  border:2px dashed #1e1e1e;background:#050505;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;position:relative;
  transition:all .2s;
}
.upload-zone:hover{border-color:var(--green);background:#0a150a;}
.upload-zone.has-img{border-color:var(--green);}
.upload-zone img{width:100%;height:100%;object-fit:cover;}
.upload-hint{color:#333;font-size:20px;padding:20px;text-align:center;}
.btn-remove-img{background:none;border:none;color:#8a3a3a;font-size:15px;cursor:pointer;font-family:'VT323',monospace;margin-top:4px;}

/* Modal actions */
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
.btn-cancel{background:transparent;border:1px solid #222;color:#444;border-radius:6px;padding:10px 18px;cursor:pointer;font-size:17px;font-family:'VT323',monospace;}
.btn-save{background:#000;border:2px solid var(--green);color:var(--green);border-radius:6px;padding:10px 24px;cursor:pointer;font-size:17px;font-family:'VT323',monospace;transition:all .2s;}
.btn-save:hover{background:#0d2a0d;box-shadow:0 0 20px rgba(74,222,128,.35);}

/* Delete confirm */
.del-modal{
  background:#080505;border:1px solid #3a1010;border-radius:12px;
  padding:28px;max-width:320px;text-align:center;width:100%;
  animation:shake .35s ease, fadeSlideIn .2s ease;
  box-shadow:0 0 50px rgba(248,113,113,.1);
}
.del-icon{font-size:44px;margin-bottom:10px;}
.del-title{color:var(--red);font-size:22px;line-height:1.4;margin-bottom:6px;}
.del-sub{color:#5a2a2a;font-size:17px;margin-bottom:20px;}
.del-actions{display:flex;gap:10px;justify-content:center;}
.btn-del-confirm{background:#1a0000;border:2px solid var(--red);color:var(--red);border-radius:6px;padding:10px 18px;cursor:pointer;font-size:17px;font-family:'VT323',monospace;box-shadow:0 0 12px rgba(248,113,113,.2);}
.btn-del-cancel{background:#0a0a0a;border:1px solid #222;color:#555;border-radius:6px;padding:10px 18px;cursor:pointer;font-size:17px;font-family:'VT323',monospace;}

/* Expanded image */
.img-expand-overlay{position:fixed;inset:0;background:rgba(0,0,0,.97);display:flex;align-items:center;justify-content:center;z-index:200;cursor:zoom-out;padding:20px;}
.img-expand-overlay img{max-width:90vw;max-height:90vh;border-radius:8px;border:1px solid #222;box-shadow:0 0 80px rgba(74,222,128,.15);animation:fadeSlideIn .2s ease;}

/* Hidden */
.hidden{display:none!important;}

/* Animations */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseGlow{
  0%,100%{text-shadow:0 0 20px rgba(74,222,128,.5),0 0 40px rgba(74,222,128,.2),3px 3px 0 #0a2a0a}
  50%{text-shadow:0 0 30px rgba(74,222,128,.8),0 0 60px rgba(74,222,128,.4),3px 3px 0 #0a2a0a}
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes statPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

@media(max-width:500px){
  .field-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="wrap">
  <!-- Header -->
  <div class="header">
    <div class="pick">⛏️</div>
    <h1 class="title">FARM CATALOG</h1>
    <div class="subtitle">SURVIVAL FOE</div>
  </div>

  <!-- Stats: só total -->
  <div class="stats" id="stats"></div>

  <!-- Controls -->
  <div class="controls">
    <input class="search" id="search" type="text" placeholder="🔍 BUSCAR FARM..." oninput="render()"/>
    <button class="btn-add" onclick="openAdd()">+ NOVA FARM</button>
  </div>

  <!-- Categories -->
  <div class="cats" id="cats"></div>

  <!-- Grid -->
  <div class="farm-grid" id="farm-grid"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay hidden" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">✦ NOVA FARM</div>

    <div class="field">
      <label>IMAGEM DA FARM</label>
      <div class="upload-zone" id="upload-zone" style="height:80px" onclick="document.getElementById('img-input').click()">
        <div class="upload-hint">📷 CLIQUE PARA ADICIONAR IMAGEM</div>
      </div>
      <button class="btn-remove-img hidden" id="btn-remove-img" onclick="removeImg()">✕ remover imagem</button>
      <input type="file" id="img-input" accept="image/*" class="hidden" onchange="handleImg(event)"/>
    </div>

    <div class="field">
      <label>NOME DA FARM</label>
      <input type="text" id="f-nome" placeholder="Ex: Farm de Blaze"/>
    </div>
    <div class="field">
      <label>COORDENADAS</label>
      <input type="text" id="f-coords" placeholder="X: 0, Y: 64, Z: 0"/>
    </div>
    <div class="field-row">
      <div class="field" style="margin:0">
        <label>CATEGORIA</label>
        <select id="f-tipo">
          <option>Mob</option><option>Recursos</option><option>Comida</option>
          <option>XP</option><option>Redstone</option><option selected>Outras</option>
        </select>
      </div>
      <div class="field" style="margin:0">
        <label>STATUS</label>
        <select id="f-status">
          <option>Funcionando</option><option>Quebrada</option><option>Em construção</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>OBSERVAÇÕES</label>
      <textarea id="f-notas" rows="3" placeholder="Detalhes sobre a farm..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
      <button class="btn-save" onclick="salvar()">SALVAR ✦</button>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="overlay hidden" id="del-overlay">
  <div class="del-modal">
    <div class="del-icon">💀</div>
    <div class="del-title">TEM CERTEZA?</div>
    <div class="del-sub">essa farm vai pro void...</div>
    <div class="del-actions">
      <button class="btn-del-cancel" onclick="closeDelete()">CANCELAR</button>
      <button class="btn-del-confirm" onclick="confirmDelete()">DELETAR 💣</button>
    </div>
  </div>
</div>

<!-- Expanded image -->
<div class="img-expand-overlay hidden" id="img-expand" onclick="closeExpand()">
  <img id="img-expand-img" src="" alt="farm"/>
</div>

<script>
const CATS = ['Todas','Mob','Recursos','Comida','XP','Redstone','Outras'];
const CAT_EMOJI = {Todas:'🗺',Mob:'👾',Recursos:'⛏',Comida:'🌾',XP:'⚗️',Redstone:'🔴',Outras:'🧱'};
const STATUS = {
  'Funcionando':    {color:'#4ade80', bg:'#041a04', icon:'✦', label:'ONLINE'},
  'Quebrada':       {color:'#f87171', bg:'#1a0404', icon:'✖', label:'QUEBRADA'},
  'Em construção':  {color:'#facc15', bg:'#1a1204', icon:'◈', label:'WIP'},
};

let farms = [
  {id:1, nome:'Farm de Iron Golem', tipo:'Mob',    coords:'X: 120, Y: 64, Z: -340', status:'Funcionando',   notas:'Produz ~1000 iron/h. Requer 4 aldeias linkadas.', img:null},
  {id:2, nome:'Farm de Trigo',      tipo:'Comida', coords:'X: 0, Y: 70, Z: 200',    status:'Funcionando',   notas:'Automática com villager fazendeiro.', img:null},
  {id:3, nome:'Farm de Blaze',      tipo:'XP',     coords:'X: -880, Y: 53, Z: 440', status:'Quebrada',      notas:'Spawner bugado após update. Precisa de reforma.', img:null},
];
let nextId = 4;
let activeCat = 'Todas';
let editingId = null;
let deleteId = null;
let formImg = null;

/* ── Animated background ── */
(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let particles = [], stars = [];

  function resize(){
    c.width = innerWidth; c.height = innerHeight;
    initStars(); initParticles();
  }

  function initStars(){
    stars = Array.from({length:60},()=>({
      x: Math.random()*c.width,
      y: Math.random()*c.height,
      r: Math.random()>.75?1.5:1,
      phase: Math.random()*Math.PI*2,
      speed: .4+Math.random()*.9,
    }));
  }

  function initParticles(){
    particles = Array.from({length:18},()=>makeParticle());
  }

  function makeParticle(){
    return {
      x: Math.random()*c.width,
      y: Math.random()*c.height,
      vx: (Math.random()-.5)*.3,
      vy: -.2-Math.random()*.4,
      size: 1+Math.random()*2,
      life: Math.random(),
      maxLife: .4+Math.random()*.6,
      color: Math.random()>.5 ? '74,222,128' : '100,180,100',
    };
  }

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const t = Date.now()/1000;

    // Stars
    stars.forEach(s=>{
      const a = .1+.5*(.5+.5*Math.sin(t*s.speed+s.phase));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill();
    });

    // Floating particles (green dust)
    particles.forEach((p,i)=>{
      p.x += p.vx; p.y += p.vy; p.life += .004;
      if(p.life>=p.maxLife){ particles[i]=makeParticle(); return; }
      const progress = p.life/p.maxLife;
      const a = progress<.3 ? progress/.3 : 1-((progress-.3)/.7);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1-progress*.5),0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.color},${a*.35})`; ctx.fill();
    });

    // Subtle green grid glow at random spots
    requestAnimationFrame(draw);
  }

  resize(); draw();
  window.addEventListener('resize', resize);
})();

/* ── Render ── */
function renderStats(){
  const total = farms.length;
  document.getElementById('stats').innerHTML=`
    <div class="stat-card" style="background:#4ade800a;border:1px solid #4ade8030;animation-delay:.3s">
      <div class="stat-val" style="color:#4ade80;text-shadow:0 0 16px #4ade8099">${total}</div>
      <div class="stat-lbl">FARMS NO MUNDO</div>
    </div>
  `;
}

function renderCats(){
  document.getElementById('cats').innerHTML=CATS.map(c=>`
    <button class="cat-btn ${activeCat===c?'active':''}" onclick="setCat('${c}')">${c}</button>
  `).join('');
}

function setCat(c){activeCat=c;render();}

function render(){
  renderStats();
  renderCats();
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=farms.filter(f=>{
    const matchCat=activeCat==='Todas'||f.tipo===activeCat;
    const matchQ=f.nome.toLowerCase().includes(q)||f.notas.toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  const grid=document.getElementById('farm-grid');
  if(filtered.length===0){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">😶</div><div class="empty-txt">NENHUMA FARM ENCONTRADA</div><div class="empty-sub">adicione uma nova!</div></div>`;
    return;
  }
  grid.innerHTML=filtered.map((farm,idx)=>{
    const st=STATUS[farm.status];
    const imgHtml=farm.img
      ?`<div class="card-img-wrap" onclick="expandImg('${farm.img}')">
          <img src="${farm.img}" alt="${farm.nome}"/>
          <div class="img-fade"></div>
          <div class="zoom-hint">🔍</div>
        </div>`
      :`<div class="card-no-img" style="background:${st.color}06">${CAT_EMOJI[farm.tipo]}</div>`;
    return `
      <div class="farm-card" style="border-top:2px solid ${st.color};animation-delay:${idx*.07}s">
        ${imgHtml}
        <div class="card-body">
          <div class="card-top">
            <div class="card-name">${farm.nome}</div>
            <span class="status-badge" style="background:${st.bg};border:1px solid ${st.color}33;color:${st.color}">${st.icon} ${st.label}</span>
          </div>
          <span class="type-pill">${farm.tipo}</span>
          ${farm.coords?`<div class="card-coords">📍 ${farm.coords}</div>`:''}
          ${farm.notas?`<div class="card-notes">${farm.notas}</div>`:''}
          <div class="card-actions">
            <button class="btn-edit" onclick="openEdit(${farm.id})">✎ EDITAR</button>
            <button class="btn-del" onclick="openDelete(${farm.id})">✕</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function openAdd(){
  editingId=null; formImg=null;
  document.getElementById('modal-title').textContent='✦ NOVA FARM';
  document.getElementById('f-nome').value='';
  document.getElementById('f-coords').value='';
  document.getElementById('f-tipo').value='Outras';
  document.getElementById('f-status').value='Funcionando';
  document.getElementById('f-notas').value='';
  resetUploadZone();
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function openEdit(id){
  const f=farms.find(x=>x.id===id);
  editingId=id; formImg=f.img||null;
  document.getElementById('modal-title').textContent='✎ EDITAR FARM';
  document.getElementById('f-nome').value=f.nome;
  document.getElementById('f-coords').value=f.coords;
  document.getElementById('f-tipo').value=f.tipo;
  document.getElementById('f-status').value=f.status;
  document.getElementById('f-notas').value=f.notas;
  if(f.img){
    const z=document.getElementById('upload-zone');
    z.style.height='150px'; z.classList.add('has-img');
    z.innerHTML=`<img src="${f.img}" alt="preview"/>`;
    document.getElementById('btn-remove-img').classList.remove('hidden');
  } else { resetUploadZone(); }
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(){document.getElementById('modal-overlay').classList.add('hidden');}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function salvar(){
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome)return;
  const farm={
    nome,
    tipo:document.getElementById('f-tipo').value,
    coords:document.getElementById('f-coords').value.trim(),
    status:document.getElementById('f-status').value,
    notas:document.getElementById('f-notas').value.trim(),
    img:formImg,
  };
  if(editingId) farms=farms.map(f=>f.id===editingId?{...farm,id:editingId}:f);
  else farms.push({...farm,id:nextId++});
  closeModal(); render();
}

function handleImg(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    formImg=ev.target.result;
    const z=document.getElementById('upload-zone');
    z.style.height='150px'; z.classList.add('has-img');
    z.innerHTML=`<img src="${formImg}" alt="preview"/>`;
    document.getElementById('btn-remove-img').classList.remove('hidden');
  };
  r.readAsDataURL(file);
}

function removeImg(){
  formImg=null; resetUploadZone();
  document.getElementById('img-input').value='';
}

function resetUploadZone(){
  const z=document.getElementById('upload-zone');
  z.style.height='80px'; z.classList.remove('has-img');
  z.innerHTML='<div class="upload-hint">📷 CLIQUE PARA ADICIONAR IMAGEM</div>';
  document.getElementById('btn-remove-img').classList.add('hidden');
}

function openDelete(id){deleteId=id;document.getElementById('del-overlay').classList.remove('hidden');}
function closeDelete(){document.getElementById('del-overlay').classList.add('hidden');}
function confirmDelete(){farms=farms.filter(f=>f.id!==deleteId);closeDelete();render();}

function expandImg(src){
  document.getElementById('img-expand-img').src=src;
  document.getElementById('img-expand').classList.remove('hidden');
}
function closeExpand(){document.getElementById('img-expand').classList.add('hidden');}

render();
</script>
</body>
</html>
